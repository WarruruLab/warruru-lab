{# 준비도 — **막대가 아니라 칸이다**(2026-09-07 재설계).

   막대는 "얼마나 왔나" 를 말하고 칸은 "몇 칸이 비었나" 를 말한다.
   이 도구가 매번 답하려는 질문은 후자다. 다섯 화면이 이 파일 하나를 쓴다.

   0/0 은 0% 다. 요구 기술을 아직 못 적은 것과 다 갖춘 것은 다른 상태다. #}
<span class="grid-gauge" role="img"
      aria-label="준비도 {{ coverage.covered }} / {{ coverage.total }}">
  {%- for n in range(coverage.total) -%}
  <span class="cell {{ 'on' if n < coverage.covered }}"></span>
  {%- endfor -%}
</span>
<span class="gauge-read">{{ coverage.covered }} / {{ coverage.total }} 슬러그</span>
